<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>images/logo-sgcc.svg" type="image/svg+xml">
    <link rel="stylesheet" href="<%= BASE_URL %>fonts/noto-sans-sc/source-han-sans-sc.css">
    <title>零碳园区智慧能碳服务平台</title>
  </head>
  <body>
    <noscript>
      <strong>请启用 JavaScript 以使用本应用。</strong>
    </noscript>
    <div id="app"></div>
    <script>
      // 全局错误捕获 - 用于诊断白屏问题
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;padding:10px;z-index:99999;font-size:14px;';
        errDiv.textContent = 'JS Error: ' + msg + ' at line ' + line + ' - ' + (error ? error.stack : '');
        document.body.appendChild(errDiv);
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:orange;color:white;padding:10px;z-index:99999;font-size:14px;';
        errDiv.textContent = 'Promise Error: ' + (e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'unknown');
        document.body.appendChild(errDiv);
      });
    </script>
  </body>
</html>
